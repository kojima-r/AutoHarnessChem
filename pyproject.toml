[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoharnesschem"
version = "0.1.0"
description = "Switchable agentic harness for quantum chemistry / ML tasks (Deep Agents / Claude Agent SDK / OpenAI Agents SDK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.0"]
openai = ["openai-agents>=0.2.0"]
deepagents = ["deepagents>=0.1.0", "langgraph>=0.2"]
chem = ["rdkit", "pyscf", "scikit-learn", "pandas", "matplotlib"]
api = ["fastapi", "uvicorn", "python-multipart"]
search = ["httpx"]
dev = ["pytest>=8"]

[project.scripts]
ahc = "app.cli:main"

[tool.setuptools]
packages = ["app", "schemas", "harness", "tools", "adapters", "evolver", "benchmarks",
            "benchmarks_chemeval"]

[tool.setuptools.package-data]
# ChemEval のタスクカタログ（採点方式と task_type の対応表）
benchmarks_chemeval = ["tasks.yaml"]
# vendor/ には SmilesDrawer を同梱している（Web UI の配信と HTML レポートへの埋め込みに使う）
app = ["web/*.html", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
