# ChemEval タスクカタログ（AutoHarnessChem 側の評価定義）
#
# ChemEval のデータ（HuggingFace: Ooo1/ChemEval）は 1 行につき
#   query（問題文。出力形式の指示を含む） / target（正解） / filename（タスク名）
# を持つ。filename から 0shot / 3shot の印（`3shot_` 接頭・`_3shot` 接尾）と拡張子を
# 落としたものが `key`。ここではその key ごとに
#   - level / dimension : 論文の 4 レベル・13 能力次元（集計の軸）
#   - metric            : 採点方式（benchmarks_chemeval/metrics.py の METRICS のキー）
#   - ahc_task_type     : ahc に渡す task_type。Skill 選択とツール（pyscf / ReactionT5 /
#                         AiZynthFinder / RDKit）の使用可否がこれで決まる
#   - answer_type       : 期待する answer の型（抽出時の整形に使う）
# を対応づける。**正解と採点方式は Evolver の変更禁止対象**（benchmarks/tasks.yaml と同じ扱い）。
#
# metric の意味（詳細は metrics.py の docstring）:
#   choice        選択肢集合の完全一致          true_false   正誤判定の一致
#   yes_no        Yes/No の一致                 contains     単一ラベルの包含一致
#   entity_f1     カンマ区切り集合の F1          relation_f1  (…) タプル集合の F1
#   reagent_f1    試薬集合の F1 + 正規化一致      sider        20 ラベルの平均一致率
#   regression    RMSE / MAE（数値・範囲は中央値） range_overlap 範囲の重なり率
#   smiles        正準 SMILES 完全一致 + Tanimoto formula      分子式の一致 + 原子組成類似度
#   iupac         IUPAC 名の一致 + BLEU + 編集距離  selfies    SELFIES/SMILES 相互変換の一致
#   judge         LLM-as-judge（0..1 の得点）

