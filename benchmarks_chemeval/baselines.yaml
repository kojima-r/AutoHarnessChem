# ChemEval 論文（ICLR 2026）Table 1 の文献値。
# 他手法と比べるための出典データで、ahc 側の採点には一切使わない。
# 転記元は ChemEval/docs/assets/chemeval-text-zero-shot-results.png（論文 Table 1 の図）。
source:
  paper: 'ChemEval: A Multi-level and Fine-grained Chemical Capability Evaluation for Large Language Models'
  venue: ICLR 2026
  table: 'Table 1: Performance overview of representative multi-level 0-Shot text tasks on ChemEval'
  url: https://openreview.net/forum?id=JrqjSkEPrX
  local_figure: benchmarks_chemeval/ChemEval/docs/assets/chemeval-text-zero-shot-results.png
  transcribed_on: '2026-09-10'
  notes:
  - 値は論文の表のまま（0..100 スケール。L2 / NRMSE のみ素の距離）。report では comparable な行を /100 して ahc の 0..1 と並べる。
  - arXiv:2409.13989 は 42 タスク版の旧稿で数値が異なるため混ぜていない。出典は上記 ICLR 版 Table 1 のみ。
  - Claude3.7T = Claude 3.7-Sonnet-Thinking。論文は素の LLM を 0-shot で評価しており、ahc は「ツール + Verifier + 再計画ループ」なので同条件の比較ではない。
  - null は表の '-'（有効な回答が無く指標を計算できなかったもの）。
